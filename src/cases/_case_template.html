<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{TITLE}}</title>

    <meta
      name="description"
      content="{{DESCRIPTION}}"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Base CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/blog-single.css" />
    <!-- Use color-4 as the main skin -->
    <link rel="stylesheet" href="css/skins/color-4.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
    />

    <!-- Alternate skins (same as index) -->
    <link
      rel="stylesheet"
      href="css/skins/color-1.css"
      class="alternate-style"
      title="color-1"
      disabled
    />
    <link
      rel="stylesheet"
      href="css/skins/color-2.css"
      class="alternate-style"
      title="color-2"
      disabled
    />
    <link
      rel="stylesheet"
      href="css/skins/color-3.css"
      class="alternate-style"
      title="color-3"
      disabled
    />
    <link
      rel="stylesheet"
      href="css/skins/color-4.css"
      class="alternate-style"
      title="color-4"
    />
    <link
      rel="stylesheet"
      href="css/skins/color-5.css"
      class="alternate-style"
      title="color-5"
      disabled
    />
    <link rel="stylesheet" href="css/flowtica.css" />


    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="images/fabicon.png" />
  </head>

  <body class="case-page">
    <!-- Main Container Start -->
    <div class="main-container">
      {{NAV}}
      
      <!-- Main Content Start -->
      <div class="main-content">
        {{CONTENT}}

        <section class="section case-cta">
          <div class="container">
            <div class="row">
              <div class="padd-15">
                <h3>See this in your environment</h3>
                <p>
                  Start with a free workflow assessment. If it’s a fit, we’ll build a 2-week MVP connected to your
                  tools so you can validate impact quickly.
                </p>
                <a href="index.html#contact" class="btn">Request a Free Workflow Assessment</a>
              </div>
            </div>
          </div>
        </section>
      </div>
      <!-- Main Content End -->
    </div>
    <!-- Main Container End -->

    <!-- Scripts -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"
      referrerpolicy="no-referrer"
    ></script>
    <script src="js/script.js"></script>
  </body>
</html>
