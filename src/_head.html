<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{PAGE_TITLE}}</title>

    <!-- SEO -->
    <meta
      name="description"
      content="{{PAGE_DESCRIPTION}}"
    />
    <meta
      name="keywords"
      content="{{PAGE_KEYWORDS}}"
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="{{PAGE_CANONICAL}}" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="{{OG_TITLE}}"
    />
    <meta
      property="og:description"
      content="{{OG_DESCRIPTION}}"
    />
    <meta property="og:url" content="{{OG_URL}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flowtica" />
    <meta property="og:locale" content="en_CA" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Flowtica",
        "url": "https://flowtica.ca/",
        "description": "AI workflow automation partner specializing in dependable AI assistants, phone agents, and integrations for service-oriented and operations-heavy businesses.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "CA"
        },
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "contactType": "sales",
            "email": "hello@flowtica.ca",
            "availableLanguage": ["en"]
          }
        ]
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Base CSS -->
    <link rel="stylesheet" href="{{ASSET_PREFIX}}css/style.css" />
    <link rel="stylesheet" href="{{ASSET_PREFIX}}css/blog-single.css" />
    <!-- Use color-4 as the main skin -->
    <link rel="stylesheet" href="{{ASSET_PREFIX}}css/skins/color-4.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
    />

    <!-- Style Switcher (color-4 as default active) -->
    <link
      rel="stylesheet"
      href="{{ASSET_PREFIX}}css/skins/color-1.css"
      class="alternate-style"
      title="color-1"
      disabled
    />
    <link
      rel="stylesheet"
      href="{{ASSET_PREFIX}}css/skins/color-2.css"
      class="alternate-style"
      title="color-2"
      disabled
    />
    <link
      rel="stylesheet"
      href="{{ASSET_PREFIX}}css/skins/color-3.css"
      class="alternate-style"
      title="color-3"
      disabled
    />
    <link
      rel="stylesheet"
      href="{{ASSET_PREFIX}}css/skins/color-4.css"
      class="alternate-style"
      title="color-4"
    />
    <link
      rel="stylesheet"
      href="{{ASSET_PREFIX}}css/skins/color-5.css"
      class="alternate-style"
      title="color-5"
      disabled
    />
    <link rel="stylesheet" href="{{ASSET_PREFIX}}css/flowtica.css" />


    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ASSET_PREFIX}}images/fabicon.png" />
    {{EXTRA_HEAD}}
  </head>

  <body>
    <!-- Main Container Start -->
    <div class="main-container">
      {{NAV}}
      
      <!-- Main Content Start -->
      <div class="main-content">
